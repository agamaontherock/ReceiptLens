meta:
  name: General
  description: >
    General keyword rules for Ukrainian grocery stores.
    Keywords are matched as case-insensitive substrings of item names.
    Longer keywords take priority over shorter ones.

keywords:
  Молочне:
    - молок     # молоко, молочний
    - масл      # масло
    - сметан    # сметана
    - кефір
    - йогурт
    - вершк     # вершки
    - творог

  М'ясо та ковбаси:
    - ковбас    # ковбаса, ковбасний
    - сардел    # сардельки
    - кабанос
    - сосиск    # сосиски
    - шинк      # шинка
    - м'яс      # м'ясо, м'ясний
    - філе
    - курин     # курятина
    - індич     # індичка

  Випічка та хліб:
    - хліб
    - батон
    - булк      # булка
    - завиван   # завиванець
    - багет

  Овочі:
    - картопл   # картопля
    - цибул     # цибуля
    - морков    # морква
    - огірок
    - томат
    - перець
    - капуст    # капуста
    - буряк
    - часник
    - броколі
    - салат

  Фрукти:
    - банан
    - яблук     # яблуко
    - апельсин
    - лимон
    - мандарин
    - виноград
    - полуниц   # полуниця
    - черешн    # черешня

  Снеки та солодощі:
    - батончик  # must come before батон (longer wins)
    - шоколад
    - цукерк    # цукерки
    - чипс
    - снек
    - печиво
    - вафл      # вафлі

  Напої:
    - вода
    - сік
    - напій
    - кава
    - чай
    - айран
    - квас

  Бакалія:
    - крупа
    - гречк     # гречка
    - рис
    - макарон
    - олія
    - борошн    # борошно
    - цукор
    - сіль
    - оцет
    - соус

  Сир:
    - сир       # covers both сир (cheese) and сирок (curd snack)

  Побутове:
    - пакет
    - серветк   # серветки
    - мил       # мило
    - шамп      # шампунь
    - пральн    # пральний
