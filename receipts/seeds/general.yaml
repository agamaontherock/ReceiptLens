meta:
  name: General
  description: >
    General keyword rules for Ukrainian grocery stores.
    Keywords are matched as case-insensitive substrings of item names.
    Longer keywords take priority over shorter ones.

keywords:
  Молочне:
    - молок     # молоко, молочний
    - масл      # масло
    - сметан    # сметана
    - кефір
    - йогурт
    - actimel   # Danone probiotic yogurt drink
    - вершк     # вершки
    - творог

  М'ясо та ковбаси:
    - ковбас    # ковбаса, ковбасний
    - сардел    # сардельки
    - кабанос
    - сосиск    # сосиски
    - шинк      # шинка
    - м'яс      # м'ясо, м'ясний
    - філе
    - курин     # курятина
    - індич     # індичка

  Випічка та хліб:
    - хліб
    - батон
    - булк      # булка
    - завиван   # завиванець
    - багет
    - мафін
    - піта

  Овочі:
    - картопл   # картопля
    - цибул     # цибуля
    - морков    # морква
    - огірок
    - томат
    - перець
    - капуст    # капуста
    - буряк
    - часник
    - броколі
    - салат
    - баклажан
    - кабачок
    - гарбуз

  Фрукти:
    - банан
    - яблук     # яблуко
    - апельсин
    - лимон
    - мандарин
    - виноград
    - полуниц   # полуниця
    - черешн    # черешня
    - гранат
    - авокадо
    - манго
    - персик
    - груш      # груша

  Снеки та солодощі:
    - bob snail  # children's snack brand (marmalade, candied fruit, gummies)
    - батончик   # must come before батон (longer wins)
    - шоколад
    - шок        # METRO/Silpo abbreviation of шоколад
    - цукерк     # цукерки
    - цукат      # цукати (candied fruit)
    - мармелад
    - чипс
    - снек
    - печиво
    - вафл       # вафлі

  Напої:
    - вода
    - нектар
    - сік
    - напій
    - кава
    - чай
    - айран
    - квас
    - комбуча

  Алкоголь:
    - пиво
    - вино
    - горілк    # горілка
    - коньяк
    - бренді
    - віскі
    - шампанськ # шампанське
    - лікер
    - сидр
    - слабоалк  # слабоалкогольний

  Бакалія:
    - крупа
    - гречк     # гречка
    - рис
    - макарон
    - олія
    - борошн    # борошно
    - цукор
    - сіль
    - оцет
    - соус
    - приправ   # приправа
    - гірчиц    # гірчиця (mustard)
    - базилік
    - горіх

  Сир:
    - камамбер
    - пармезан
    - моцарел   # моцарела
    - бринза
    - рикот     # рикота
    - сир       # covers both сир (cheese) and сирок (curd snack)

  Побутове:
    - пакет
    - серветк   # серветки
    - мил       # мило
    - шамп      # шампунь
    - пральн    # пральний
    - прокладк  # прокладки (full)
    - прокл     # прокл. — abbreviated (METRO)

  Морепродукти:
    - кревет

  Корм для тварин:
    - корм
    - ласощ        # ласощі для тварин
    - pet
    - purina
    - whiskas
    - dreamies
    - pedigree
    - royal canin
    - hills