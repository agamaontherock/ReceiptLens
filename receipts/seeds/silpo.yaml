meta:
  name: Silpo
  description: >
    Rules for Silpo receipts. Silpo uses heavily abbreviated item names,
    e.g. "КовКгАланЛікарВарВ/г" instead of "Ковбаса Алан Лікарська варена вищого гатунку".
    Keywords here are Silpo-specific abbreviation prefixes/patterns
    that would not match usefully in general.yaml.

keywords:
  М'ясо та ковбаси:
    - КовКг     # Ковбаса, кг (weighted)
    - СардКг    # Сардельки, кг
    - ШинкКг    # Шинка, кг
    - КурКг     # Курятина, кг
    - ІндКг     # Індичка, кг
    - СвинКг    # Свинина, кг
    - ФаршКг    # Фарш, кг
    - ОніГір    # Онігірі — Silpo sushi/snack bar items
    - Онігір

  Овочі:
    - ОгірКг    # Огірок, кг
    - ТоматКг   # Томат, кг
    - ПерецьКг  # Перець, кг
    - КартКг    # Картопля, кг
    - МорквКг   # Морква, кг
    - ЦибКг     # Цибуля, кг
    - БататКг   # Батат, кг
    - ГрибКг    # Гриби, кг
    - Капус     # Капуста

  Фрукти:
    - БананКг
    - ЯблукКг
    - АпелКг    # Апельсин, кг
    - ЛимКг     # Лимон, кг
    - МандКг    # Мандарин, кг
    - ВиногрКг  # Виноград, кг

  Сир:
    - СирКг     # Сир, кг (cheese by weight)
    - СирКгЛТ   # Сир ЛТ (Літинський), кг

  Молочне:
    - МолКг     # Молоко, кг

  Бакалія:
    - МакарКг   # Макарони, кг
    - Макар
    - Хумус

  Напої:
    - КавЗер    # Кава зернова
    - КавМел    # Кава мелена

  Побутове:
    - ПакетБіо  # Пакет біорозкладний
  
  Кулінарія:
    - СупКал    # Суп Калакейн (Silpo ready soups)
    - СупГреч   # Суп гречаний
    - РибнСуп   # Рибний суп
  
  Випічка та хліб:
    - Баг      # Багет