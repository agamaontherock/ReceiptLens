<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ReceiptLens{% endblock %}</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#0d6efd">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/static/sw.js');</script>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-3">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">
        <i class="bi bi-receipt"></i> ReceiptLens
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{% url 'scan' %}"><i class="bi bi-qr-code-scan"></i> Сканувати</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'manual' %}"><i class="bi bi-pencil-square"></i> Вручну</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'analytics' %}"><i class="bi bi-bar-chart-line"></i> Аналітика</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container pb-4">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
          {{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/htmx.org@2" defer></script>
  <script defer src="https://unpkg.com/alpinejs@3/dist/cdn.min.js"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
