services:
  - type: web
    name: receiptlens
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py collectstatic --no-input && python manage.py migrate && gunicorn receiptlens.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      # To switch to PostgreSQL: uncomment the two lines below and add a
      # "databases:" section (see render.yaml docs), or paste a DATABASE_URL
      # from an external provider (Supabase, Neon, etc.).
      #- key: DATABASE_URL
      #  value: postgresql://user:pass@host:5432/dbname
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: PYTHON_VERSION
        value: "3.13.5"
